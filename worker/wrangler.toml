# =============================================================================
# Gothwad Portal Worker config. NO SECRETS IN THIS FILE.
#
# Pattern copied from the Mail repo: this file is the source of truth, secrets
# are set in the Cloudflare dashboard (or `wrangler secret put`) and are never
# committed. `keep_vars = true` stops a deploy from deleting dashboard vars
# that aren't listed here.
#
# Secrets (never in this file):
#   OPENROUTER_API_KEY   sk-or-... from https://openrouter.ai/keys
#
# Route (production): gothwadtech.com/api/*  -> this Worker
# =============================================================================

name = "gothwad-portal"
main = "src/index.ts"
compatibility_date = "2025-09-01"

keep_vars = true

[vars]
# Root domain, used to build the allow-list of origins allowed to call /api/search.
ROOT_DOMAIN = "gothwadtech.com"

# Extra allowed origins, comma-separated (e.g. a Pages preview URL). Empty = none.
ALLOWED_ORIGINS = ""

# OpenRouter model used to write the answer. The ":free" suffix keeps the model
# itself free; note the WEB SEARCH is billed separately by OpenRouter even on
# free models (~$4 per 1,000 results), which is why the KV cache matters.
SEARCH_MODEL = "openai/gpt-oss-20b:free"

# How many web results to ask the search engine for. This is what you pay for:
# cost per query ~= max_results * $0.004.
SEARCH_MAX_RESULTS = "10"

# How long a cached answer is reused (seconds). 6 hours default.
CACHE_TTL_SECONDS = "21600"

# Max searches per IP per UTC day. 0 disables the limiter.
DAILY_QUERY_LIMIT = "30"

# "online"       -> append :online to the model slug (documented, works today)
# "server_tool"  -> pass openrouter:web_search in the tools array (newer)
# OpenRouter currently recommends the server tool for new projects; flip this
# to "server_tool" once you have confirmed it against your account.
SEARCH_MODE = "online"

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
